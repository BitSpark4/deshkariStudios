<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deshkari Studios — A Pune-based creative entertainment company building India's most culturally rooted productions, events, and films." />
    <meta name="theme-color" content="#C45911" />
    <meta property="og:title" content="Deshkari Studios — Rooted in India. Built for the World." />
    <meta property="og:description" content="Original Indian music, live cultural events, and authentic stories on screen." />
    <meta property="og:type" content="website" />
    <title>Deshkari Studios — Rooted in India. Built for the World.</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static form for Netlify's build-time bot to detect.
      Hidden from users; the real interactive form is rendered by React in ContactForm.jsx
      and submits to "/" with the same field names + form-name=contact.
      Required because Netlify cannot see SPA forms rendered at runtime.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
